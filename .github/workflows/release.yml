# Publication d'une version : envoyer l'étiquette vX.Y.Z (ou lancer à la main en donnant l'étiquette).
# Fabrique le .dmg (Mac universel), le .zip Windows et l'.apk signé, puis les met sur la page des versions.
name: Publication

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Étiquette de la version à publier (ex. v0.5.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compilation (bibliothèque C de Microsoft incluse dans l'exécutable)
        shell: bash
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release -p alpagamp
      - name: Paquet
        shell: bash
        run: cargo xtask dist-windows target/release/alpagamp.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    name: macOS (universel)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Compilation (Apple et Intel)
        run: |
          cargo build --release -p alpagamp --target aarch64-apple-darwin
          cargo build --release -p alpagamp --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/alpagamp \
            target/aarch64-apple-darwin/release/alpagamp target/x86_64-apple-darwin/release/alpagamp
      - name: Paquet
        run: cargo xtask bundle-mac target/universal/alpagamp dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Le secret ANDROID_KEYSTORE_B64 manque : l'APK doit être signé avec la clé d'Alpagamp (scripts/publier-sur-github.sh l'enregistre)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/alpagamp.p12"
      - name: APK
        env:
          ALPAGAMP_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ALPAGAMP_KEYSTORE="$RUNNER_TEMP/alpagamp.p12" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" cargo xtask apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  publish:
    name: Page des versions
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Notes de version (tirées du CHANGELOG)
        run: |
          V="${TAG#v}"
          awk -v v="$V" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {if (f) exit} f' CHANGELOG.md > notes.md
          cat scripts/notes-installation.md >> notes.md
      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*/* --clobber
          else
            gh release create "$TAG" artifacts/*/* --title "Alpagamp ${TAG#v}" --notes-file notes.md
          fi
