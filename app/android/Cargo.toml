[package]
name = "alpagamp-android"
version = "0.5.0"
description = "Alpagamp pour Android (Pixel 8) : les trois fenêtres empilées, au toucher"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "alpagamp"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
alpagamp-skin.workspace = true
alpagamp-core.workspace = true
alpagamp-audio.workspace = true
alpagamp-ui.workspace = true
alpagamp-player.workspace = true
alpagamp-spotify.workspace = true
log.workspace = true

winit = "0.30"
softbuffer = "0.4"
alpagamp-milkdrop.workspace = true
alpagamp-museum.workspace = true
alpagamp-plugins.workspace = true
sys-locale = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
android_logger = "0.15"
jni = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger.workspace = true

[[bin]]
name = "phone-sim"
path = "src/bin/phone_sim.rs"
