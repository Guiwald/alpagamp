[package]
name = "alpagamp"
version = "0.6.1"
description = "Alpagamp — lecteur de musique à skins classiques"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "alpagamp"
path = "src/main.rs"

[dependencies]
alpagamp-skin.workspace = true
alpagamp-core.workspace = true
alpagamp-audio.workspace = true
alpagamp-ui.workspace = true
alpagamp-player.workspace = true
alpagamp-spotify.workspace = true
log.workspace = true
env_logger.workspace = true
winit = "0.30"
softbuffer = "0.4"
alpagamp-milkdrop.workspace = true
alpagamp-museum.workspace = true
alpagamp-plugins.workspace = true
directories = "6"
raw-window-handle = "0.6"
sys-locale = "0.3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda = "0.21"
rfd = "0.17"

# Formes de fenêtres des skins (region.txt) : liaisons Rust vers les API du système, sans code C.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSColor", "NSScreen", "NSGraphics", "objc2-quartz-core"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAShapeLayer", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGPath"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }

[build-dependencies]
embed-resource = "3"
