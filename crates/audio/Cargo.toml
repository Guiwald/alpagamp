[package]
name = "alpagamp-audio"
version = "0.2.0"
description = "Moteur audio d'Alpagamp : décodage, rééchantillonnage, égaliseur, sortie, données de visualisation"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
alpagamp-core.workspace = true
log.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
cpal = "0.18"
symphonia = { version = "0.6", features = ["all-codecs", "all-formats"] }
rubato = "5"
audioadapter-buffers = "5"
# Flux radio en HTTPS : rustls avec la cryptographie graviola (Rust et assembleur vérifié, sans C ; ADR 0004).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-graviola = "0.4"
webpki-roots = "1"

# Certificats racines du système (proxys d'entreprise qui inspectent le TLS, comme Zscaler).
[target.'cfg(not(target_os = "android"))'.dependencies]
rustls-native-certs = "0.8"
